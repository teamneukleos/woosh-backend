services:
  postgres:
    image: postgres:16-alpine
    container_name: woosh-backend-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: woosh_backend
    ports:
      - "5436:5432"
    volumes:
      - woosh_backend_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d woosh_backend"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  woosh_backend_pg_data:
