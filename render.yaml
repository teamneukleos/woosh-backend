# Render Blueprint — staging API for Kreate
# Docs: https://render.com/docs/blueprint-spec
#
# Database: use your own (e.g. Vercel Postgres). Set DATABASE_URL in the
# Render dashboard — include ?schema=kreate (and SSL params if required).

services:
  - type: web
    name: kreate-api-staging
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true
      # Full connection string from Vercel (or other). Do not leave blank.
      - key: DATABASE_URL
        sync: false
      # Comma-separated frontend origins, e.g. https://staging.kreate.ng,http://localhost:5173
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PASSWORD_RESET_EXPIRES_MINUTES
        value: "30"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Example: https://kreate-api-staging.onrender.com/creators/social/youtube/callback
      - key: GOOGLE_YOUTUBE_REDIRECT_URI
        sync: false
      - key: SOCIAL_OAUTH_FRONTEND_REDIRECT_URL
        sync: false
      - key: SOCIAL_OAUTH_STATE_SECRET
        generateValue: true
      - key: SOCIAL_TOKEN_ENCRYPTION_KEY
        generateValue: true
